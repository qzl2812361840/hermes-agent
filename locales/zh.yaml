  compaction.preflight: "📦 预压缩：约 {tokens} tokens ≥ 阈值 {threshold}。可能需要稍等片刻。"
  compaction.idle: "💤 空闲 {idle_seconds} 秒后恢复 — 先压缩约 {tokens} tokens 再继续。"
  compaction.too_large: "🗜️ 上下文过大（约 {tokens} tokens）— 正在压缩（{attempt}/{cap}）…"
  compaction.messages: "🗜️ 已压缩 {before} → {after} 条消息，正在重试…"
  compaction.tokens: "🗜️ 已压缩 ~{before} → ~{after} tokens，正在重试…"
  compaction.reduced: "🗜️ 上下文已缩减至 {new_ctx} tokens（原 {old_ctx}），正在重试…"
