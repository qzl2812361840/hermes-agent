  overflow.blocked: "⚠ 上下文已超过压缩阈值（约 {tokens} tokens ≥ {threshold}），但压缩当前被阻塞（{reason}）。模型可能停止响应。请用 /new 开启新会话，或用 /compress 立即重试。"
  overflow.compression_disabled: "⚠️ 本会话上下文（约 {preflight_tokens} tokens）已超出模型上下文窗口（约 {context_length} tokens），而压缩已禁用（compression.enabled: false）。请用 /compact 压缩历史，或在 config.yaml 中启用压缩。"
